[project]
name = "mts-client-integration-mcp"
version = "0.1.0"
description = "Local MCP server for MTS Transaction 3.0 client integration."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sportradar AG" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.1.6",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.2",
    "referencing>=0.37.0",
    "websockets>=17.4",
]

[project.urls]
Homepage = "https://github.com/sportradar/mts-client-integration-mcp"
Repository = "https://github.com/sportradar/mts-client-integration-mcp"
Issues = "https://github.com/sportradar/mts-client-integration-mcp/issues"

[project.scripts]
mts-mcp-server = "mts_client_integration.tools.mcp_server:main"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = true

# Public PyPI for committed uv.lock (CI and external contributors).
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/mts_client_integration"]

[tool.hatch.build.targets.wheel.force-include]
"src/mts_client_integration/data/rejection_codes.json" = "mts_client_integration/data/rejection_codes.json"
"src/mts_client_integration/data/session_state.md" = "mts_client_integration/data/session_state.md"
"src/mts_client_integration/models/ticket3/schemas/request.json" = "mts_client_integration/models/ticket3/schemas/request.json"
"src/mts_client_integration/models/ticket3/schemas/response.json" = "mts_client_integration/models/ticket3/schemas/response.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["mts_client_integration"]
omit = ["src/mts_client_integration/__main__.py"]

[tool.coverage.report]
fail_under = 86
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/mts_client_integration/services/business_rules/*",
    "src/mts_client_integration/services/ack_state_machine.py",
]
pytest_add_cli_args_test_selection = ["src/tests/"]
mutate_only_covered_lines = true

[tool.mutation-gate]
fail_under = 60

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/mts_client_integration/models/ticket3/_generated.py" = ["E501", "S105"]
"src/tests/**" = ["S101"]
"scripts/regenerate_ticket3_models.py" = ["S603"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src", "scripts"]
strict = true

[[tool.mypy.overrides]]
module = "mts_client_integration.models.ticket3._generated"
ignore_errors = true
